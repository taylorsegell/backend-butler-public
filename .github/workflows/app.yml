name: Butler app

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: App tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend_butler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend_butler/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
