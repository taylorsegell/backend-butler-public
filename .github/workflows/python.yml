name: Python

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Python tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [agent, ha-notify-scheduler]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.0'
          python-version: '3.13'
      - run: uv sync --frozen
      - run: uv run --no-sync ruff check .
        if: matrix.project == 'agent'
      - run: uv run --no-sync pytest -q

  compose:
    name: Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker-compose.yml is valid with the example env
        run: cp .env.example .env && docker compose config --quiet
