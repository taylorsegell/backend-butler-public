[project]
name = "backend-butler-agent"
version = "0.1.0"
description = "LiveKit voice agent that controls Home Assistant via its native MCP server"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "livekit-agents[mcp,a2a,openai]>=1.6",
    "livekit-protocol>=1.1.27",
    "python-dotenv>=1.0",
    "pandas>=2.0",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pandas-stubs>=2.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.uv]
package = false
# The draft LiveKit pin caps OpenTelemetry below the security fix. Keep its
# persistence API stable while using the patched API/SDK/exporter together.
# GHSA-xcq7-p3pf-p88h; remove when upstream permits OpenTelemetry >=1.45.1.
override-dependencies = [
    "opentelemetry-api>=1.45.1,<1.46",
    "opentelemetry-sdk>=1.45.1,<1.46",
    "opentelemetry-exporter-otlp>=1.45.1,<1.46",
]

# Text chat runs on the draft session-persistence API (livekit/agents#7465), which needs
# livekit-protocol's agent-db module from python-sdks main (livekit/python-sdks#831).
# Both are pinned to commits. To move them: set the new revs, `uv lock && uv sync`, check
# that patches/ still apply (the Docker build fails if one does not; drop a patch the new
# rev includes), then `uv run pytest`: tests/test_persistence.py drives every draft API
# the text chat uses (all of it is in src/conversations.py, src/text_chat/ and the
# AgentServer(store=) line in src/main.py). Saved conversations from an older schema may
# not load; move agent-data/ aside to start over. Once the feature is released, drop
# these sources and raise the version floors instead.
[tool.uv.sources]
livekit-agents = { git = "https://github.com/livekit/agents.git", rev = "5359777b6a01cdd6caa7b1108cd20d48f51edff3", subdirectory = "livekit-agents" }
livekit-protocol = { git = "https://github.com/livekit/python-sdks.git", rev = "082e83c44dea983cca8aec21c948f84aa040d97c", subdirectory = "livekit-protocol" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:anyio"
asyncio_default_fixture_loop_scope = "function"
