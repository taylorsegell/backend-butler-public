configuration:
  anthropic_api_key:
    name: Anthropic API key
    description: Your key from console.anthropic.com. Required. Messages, photos and entity names are sent to Anthropic with it.
  model:
    name: Model
    description: The Claude model to use. The default is claude-sonnet-5-5.
  stt_pipeline:
    name: Voice pipeline
    description: Which Assist pipeline turns your voice into text. "auto" picks your preferred pipeline if it uses a cloud speech-to-text engine, otherwise the first pipeline using OpenAI, Google AI or ElevenLabs. Or enter a pipeline id. Audio is sent to that pipeline's engine.
  api_token:
    name: Bridge token
    description: Lets the voice worker hand requests to Butler over the bridge port. Leave empty to keep the port closed. Use a long random value and put the same value in the worker's BUTLER_API_TOKEN.
network:
  8098/tcp: Voice worker bridge (MCP)
